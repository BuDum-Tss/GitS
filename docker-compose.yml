# Общие сервисы GitS: голос ГЛаДОС (локально, на GPU) и монтаж видео (общий контейнер montage, см. его описание ниже). Голос по умолчанию ESpeech: `docker compose up -d` поднимает espeech;
# Fish Speech запасной и стоит за профилем fish: `docker compose --profile fish up -d fish-speech`.
# Сервисы необязательны: без ESpeech и Fish Speech сервис voice говорит запасным голосом edge-tts. Распознавание речи для движка голоса
# ядра это общий контейнер stt (GigaAM на процессоре, запасной faster-whisper; ниже); голос ПК пока распознаёт сам внутри сервиса voice. Веса: Fish Speech в models/tts/checkpoints, веса ESpeech в
# services/f5-tts/weights, референс голоса у сервис voice). ESpeech в контейнере: в .env ESPEECH_EXTERNAL=1, чтобы супервизор
# ядра не поднимал второй процесс на том же порту. На видеокарте с 6 ГБ вместе с локальной моделью (LM Studio) и игрой видеопамяти
# может не хватить, поэтому поднимай то, что нужно сейчас.
# Имя проекта фиксировано: все сервисы всегда в группе gits в Docker Desktop, как бы ни называлась папка репозитория.
name: gits

services:
  fish-speech:
    profiles: ["fish"]                          # запасной голос: не поднимается по умолчанию
    build:
      context: .
      dockerfile: docker/fish-speech/Dockerfile
    image: fish-speech-custom:latest
    container_name: fish-speech-tts
    restart: "no"
    ports:
      - "${FISH_HOST:-127.0.0.1}:${FISH_PORT:-8080}:8080"
    volumes:
      - ${FISH_CHECKPOINTS:-./models/tts/checkpoints}:/opt/fish-speech/checkpoints
      - ./resources/GlaDOS/voice:/opt/fish-speech/references
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ESpeech-TTS-1 (F5-TTS, русский): тот же сервис, что services/f5-tts/f5_server.py. Первый запуск докачивает модели RUAccent и vocos
  # в том espeech_cache; /health отвечает 503, пока модель грузится.
  espeech:
    build:
      context: .
      dockerfile: docker/espeech/Dockerfile
    image: espeech-tts:latest
    container_name: espeech-tts
    restart: "no"
    ports:
      - "${ESPEECH_HOST:-127.0.0.1}:${ESPEECH_PORT:-8771}:8771"
    environment:
      F5_HOST: 0.0.0.0
      F5_CKPT: /opt/f5-tts/weights/espeech/espeech_tts_256k.pt
      F5_VOCAB: /opt/f5-tts/weights/espeech/vocab.txt
      F5_WARMUP_DIR: /opt/f5-tts/references
    volumes:
      - ${ESPEECH_WEIGHTS:-./services/f5-tts/weights}:/opt/f5-tts/weights
      - ./resources/GlaDOS/voice:/opt/f5-tts/references:ro
      - espeech_cache:/home/app/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Классификатор обращений decider (GLiNER2.5-multi-Decide, процессор, без GPU): ОДИН общий контейнер для всех ядер. Ядро ходит к нему по
  # имени decider в сети gits_default (GITS_DECIDER_URL=http://decider:8768); процессы хоста видят порт на 127.0.0.1. Веса (около 1,1 ГБ)
  # лежат на хосте в services/decider/hf, том только для чтения. Чтобы супервизор ядра на хосте не поднимал второй процесс: DECIDER_EXTERNAL=1 в .env.
  decider:
    build:
      context: .
      dockerfile: docker/decider/Dockerfile
    image: gits-decider:latest
    container_name: decider
    restart: "no"
    ports:
      - "${DECIDER_HOST:-127.0.0.1}:${DECIDER_PORT:-8768}:8768"
    volumes:
      - ${DECIDER_WEIGHTS:-./services/decider/hf}:/opt/decider/hf:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8768/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Распознавание речи stt (GigaAM v3 через onnx-asr на процессоре, запасной faster-whisper): ОДИН общий контейнер для всех ядер, как decider.
  # Движок голоса ядра ходит к нему по имени stt в сети gits_default (GITS_STT_URL=http://stt:8772, POST /v1/transcribe); порт на хост НЕ
  # публикуется (чтобы открыть для отладки: добавь ports: ["127.0.0.1:8772:8772"]). Сервис ничего не качает: кэш моделей Hugging Face
  # монтируется только для чтения. По умолчанию это готовый кэш хоста ~/.cache/huggingface (нужны istupakov/gigaam-v3-onnx и
  # Systran/faster-whisper-small); другой путь: HF_HOME_HOST в .env. Если кэша нет: разовая загрузка в том stt_models одной командой
  #   docker compose --profile fetch run --rm stt-fetch        и затем HF_HOME_HOST=stt_models в .env
  # Подробности: services/stt/README.md. /health отвечает 503, пока модель не загружена.
  stt:
    build:
      context: .
      dockerfile: docker/stt/Dockerfile
    image: gits-stt:latest
    container_name: stt
    restart: unless-stopped
    mem_limit: ${STT_MEM_LIMIT:-2g}
    environment:
      GITS_STT_ENGINE: ${GITS_STT_ENGINE:-gigaam}              # gigaam (запасной whisper) | whisper
      GITS_STT_GIGAAM: ${GITS_STT_GIGAAM:-gigaam-v3-e2e-rnnt}
      GITS_STT_MODEL: ${GITS_STT_MODEL:-small}                 # модель запасного faster-whisper
      GITS_STT_LANGUAGE: ${GITS_STT_LANGUAGE:-ru}
      GITS_STT_THREADS: ${GITS_STT_THREADS:-2}                 # потоков процессора на одно распознавание
      STT_WORKERS: ${STT_WORKERS:-2}                           # распознаваний одновременно
      STT_QUEUE: ${STT_QUEUE:-8}                               # ожидающих сверх воркеров; больше: 503
      STT_TIMEOUT_S: ${STT_TIMEOUT_S:-30}
    expose:
      - "8772"
    volumes:
      - ${HF_HOME_HOST:-~/.cache/huggingface}:/models/hf:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8772/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Разовая загрузка весов распознавания в том stt_models (нужна, только если готового кэша Hugging Face на хосте нет). Профиль fetch: сам
  # не поднимается. Сеть здесь нужна (при VPN запускай с включённым VPN); повтор безопасен: скачанное не качается заново.
  stt-fetch:
    profiles: ["fetch"]
    build:
      context: .
      dockerfile: docker/stt/Dockerfile
    image: gits-stt:latest
    container_name: stt-fetch
    restart: "no"
    command: ["python", "-m", "stt.fetch"]
    environment:
      HF_HUB_OFFLINE: "0"
      GITS_STT_GIGAAM: ${GITS_STT_GIGAAM:-gigaam-v3-e2e-rnnt}
      GITS_STT_MODEL: ${GITS_STT_MODEL:-small}
      # при необходимости прокси: HTTPS_PROXY: ${HTTPS_PROXY:-}
    volumes:
      - stt_models:/models/hf

  # Монтаж видео: ОДИН общий контейнер на всех персонажей (пространство, которое ядро берёт в аренду как семафор). К ядру при старте
  # не подключается: ждёт аренды на порту управления 8780 (только сеть compose gits_default, на хост не публикуется; ядро
  # персонажа видит его по имени montage, control_url в agent/peers.container.yaml). Запуск:
  #   docker compose --env-file .env up -d montage        (--env-file .env нужен, чтобы подставился GITS_CONTROL_TOKEN из .env)
  # Секреты .env монтажу не передаются (env_file нет): только токен управления. Папка каждого персонажа монтируется отдельной строкой
  # ниже в /characters/<id>: новому персонажу добавь свою (например ./resources/Aperture:/characters/aperture); хозяин аренды видит
  # только свою папку. Токен шины ядра приходит в acquire (GITS_CORE_URL и GITS_TOKEN не задаются). Образ: gits-montage:dev.
  montage:
    build:
      context: .
      dockerfile: docker/montage/Dockerfile
    image: ${MONTAGE_IMAGE:-gits-montage:dev}
    container_name: montage
    restart: unless-stopped
    environment:
      GITS_CONTROL_TOKEN: ${GITS_CONTROL_TOKEN:-}
      GITS_CONTROL_PORT: "8780"
      # папки персонажей: ресурсы хозяина аренды из <root>/<персонаж>/montage, готовые ролики в <root>/<персонаж>/montage/out
      GITS_CHARACTERS_ROOT: /characters
      # рабочая память (папки задач jobs/<персонаж>, обучающий журнал) в общем томе, а не в слое контейнера
      MEMORY_DIR: /work
      MONTAGE_JOBS_DIR: /work/jobs
      # Remotion Studio задач: порты из этого диапазона опубликованы на хост (ниже), адрес Studio http://127.0.0.1:<порт>
      MONTAGE_SITE_PORT: "8790"                      # сайт монтажа (сценарий, монтажный лист, файлы)
      MONTAGE_STUDIO_PORTS: "8791-8794"
    expose:
      - "8780"
    ports:
      - "127.0.0.1:8790-8794:8790-8794"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8780/status', headers={'Authorization': 'Bearer ' + os.environ['GITS_CONTROL_TOKEN']}), timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - ./resources/GlaDOS:/characters/glados
      - montage_work:/work
      # исходники для монтажа: пути в запросе work.create должны быть путями контейнера, поэтому кладите файлы в /inbox:
      # - ${MONTAGE_INBOX_DIR}:/inbox:ro

  # RimWorld: общее окружение в своём контейнере (аренда, как у монтажа): код модуля работает здесь, а игра, окно, ввод и запись
  # остаются на хосте за хостовым помощником (workspaces/rimworld/host, GITS_RIMWORLD_HOST_URL). Порядок запуска: помощник на хосте,
  #   docker compose --env-file .env up -d rimworld        (--env-file .env нужен для GITS_CONTROL_TOKEN и GITS_RIMWORLD_HOST_TOKEN)
  # К ядру при старте не подключается: ждёт аренды на порту управления 8782 (только сеть compose, на хост не публикуется; ядро видит
  # его по имени rimworld, control_url в agent/peers.container.yaml). Секреты .env сервису не передаются (env_file нет): только токен
  # управления и токен помощника. Мод игры контейнер напрямую не видит (мод слушает только [::1]:8765, на 127.0.0.1:8765 может сидеть чужой процесс): RIMWORLD_API не задаётся, запросы к моду идут через прокси хостового помощника (<GITS_RIMWORLD_HOST_URL>/game-api/...). Оверлей для OBS: http://127.0.0.1:8767.
  # Папка каждого персонажа монтируется в /characters/<id> (новому персонажу добавь свою строку). Образ: gits-rimworld:dev.
  rimworld:
    build:
      context: .
      dockerfile: docker/rimworld/Dockerfile
    image: ${RIMWORLD_IMAGE:-gits-rimworld:dev}
    container_name: rimworld
    restart: unless-stopped
    environment:
      GITS_CONTROL_TOKEN: ${GITS_CONTROL_TOKEN:-}
      GITS_CONTROL_PORT: "8782"
      GITS_CHARACTERS_ROOT: /characters
      GITS_RIMWORLD_HOST_URL: ${GITS_RIMWORLD_HOST_URL:-http://host.docker.internal:8796}     # хостовый помощник
      GITS_RIMWORLD_HOST_TOKEN: ${GITS_RIMWORLD_HOST_TOKEN:-}
      RIMWORLD_MEMORY_DIR: /work/rimworld                     # память модуля в томе, а не в слое контейнера
      GITS_DASHBOARD_HOST: 0.0.0.0                            # оверлей слушает во всех интерфейсах контейнера (на хост только 127.0.0.1)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8782"
    ports:
      - "127.0.0.1:8767:8767"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8782/status', headers={'Authorization': 'Bearer ' + os.environ['GITS_CONTROL_TOKEN']}), timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - ./resources/GlaDOS:/characters/glados
      - rimworld_memory:/work/rimworld

volumes:
  espeech_cache:
  stt_models:
    name: gits-stt-models
  montage_work:
    name: gits-montage-work
  rimworld_memory:
    name: gits-rimworld-memory
