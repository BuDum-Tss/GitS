# Политика «вне игры / AFK» (ТЗ 11e, POL-11). Действует, когда модуль не в фокусе: игру не запускает и не управляет ею,
# игровые контуры (ход, планирование, рефлексия, комментатор) не держит, токены не тратит. Следит только за дешёвыми сигналами
# (игра запущена, порт мода) и передаёт ядру критические события с признаком «нужен фокус». Политика по умолчанию при старте.
id: afk
title: "Вне игры"
purpose: "Модуль не в фокусе: игра не запускается и не ведётся, токены не тратятся. Выходит по просьбе ядра (policy.activate)."
priority: 0
default: true
focus: background
interruptible: true
urgency: 0.0   # срочность 0..1 по угрозе и ожиданию (status.urgency в state)
enter:
  kinds: []
  min_importance: 0
exit:
  when: never
  quiet_s: 0
  to: observe
switch_to: []
min_dwell_s: 0
loop: passive
think:
  model: none
modes: []
