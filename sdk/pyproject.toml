[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glados-module"
version = "0.1.0"
description = "SDK модулей ГЛаДОС: протокол ядро-модуль (ТЗ 01), клиент ModuleClient, FakeCore для тестов"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]

[tool.setuptools.packages.find]
include = ["glados_module*"]

# Тесты SDK: из корня репозитория `python -m pytest -q sdk/tests` (см. check.ps1).
# pythonpath позволяет гонять тесты и без установки пакета.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "examples"]
