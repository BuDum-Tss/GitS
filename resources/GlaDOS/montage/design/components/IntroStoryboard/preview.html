  var DD = [[1.0,0],[1.05,27],[1.1,32],[1.15,43],[1.2,67],[1.25,96],[1.3,139],[1.35,160],[1.4,181],[1.45,195],[1.5,FD],[7.1,FD]];
  var LO = [[2.2,0],[2.25,.1],[2.3,.25],[2.35,.35],[2.4,.5],[2.45,.6],[2.5,.8],[2.6,1]];
  var LY = [[2.2,200],[2.25,180],[2.3,122],[2.35,86],[2.4,58],[2.45,29],[2.5,14],[2.55,4],[2.6,0]];
  function lerp(k, t) {
    if (t <= k[0][0]) return k[0][1];
    for (var i = 1; i < k.length; i++) if (t <= k[i][0]) { var a = k[i-1], b = k[i]; return a[1] + (b[1]-a[1]) * (t-a[0]) / (b[0]-a[0]); }
    return k[k.length-1][1];
  }
  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function ease(v) { v = clamp(v); return 1 - Math.pow(1 - v, 3); }
  function render(root, t) {
    var q = function (s) { return root.querySelector(s); };
    var x = lerp(X, t), d = lerp(DD, t), r = d / 2;
    var speed = Math.abs(lerp(X, t + .01) - lerp(X, t - .01)) / .02;   // px/с
    // ирис-иконка есть с первого кадра: растёт 1,05–1,5 с, вращаясь; до 1,5 с поверх надписи в режиме difference
    var ir = q('.iris'), box = q('.irisbox');
    var rot = (x - FX) / (FD / 2) * 180 / Math.PI + (t < 1.5 ? -(1.5 - t) * 540 : 0);
    var k = Math.max(d, 1) / 251;
    var op = clamp((t - 1.05) / .2) * .6 + .4 * clamp((t - 1.25) / .1);
    ir.setAttribute('transform', 'translate(' + x + ' ' + CY + ') rotate(' + rot + ') scale(' + k + ')');
    ir.setAttribute('opacity', t < 1.05 ? 0 : op);
    box.style.mixBlendMode = t < 1.5 ? 'difference' : 'normal';
    q('.mb').setAttribute('stdDeviation', (t < 1.5 ? 0 : Math.min(14, speed * .011)) + ' 0');
    // надпись открывается справа налево, пока катится ирис
    var edge = t < 1.05 ? 1280 : (t >= 2.2 ? 0 : x - r * .8);
    q('.reveal').setAttribute('x', edge); q('.reveal').setAttribute('width', 1280 - edge);
    // «А» поверх ириса после остановки
    q('.a-over').setAttribute('opacity', t >= 2.1 ? 1 : 0);
    // LABORATORIES: проявляется и поднимается 2,25–2,6 с
    var lab = q('.lab'), lo = lerp(LO, t), ly = lerp(LY, t);
    lab.setAttribute('opacity', lo);
    lab.setAttribute('transform', 'translate(0 ' + ly + ')');
    q('.lb').setAttribute('stdDeviation', (3 * (1 - clamp((t - 2.25) / .35))) + ' 0');
    lab.setAttribute('filter', t < 2.6 ? 'url(#bt-lb)' : 'none');
    // рамка: короткие сдвиги сегментов
    var g = Math.floor(t * 30), j = ((g * 2654435761) >>> 0) % 97;
    q('.border').setAttribute('transform', (j < 3 && t > 1 ? 'translate(' + ((j - 1) * 2) + ' 0)' : 'translate(0 0)'));
  }
  window.ApBoot = { render: render, DUR: DUR };
  var AUDIO = "";
  function live(root) {
    var snd = null, T0 = performance.now(), sound = false, hint = root.querySelector('.ap-boot__hint');
    function play() { if (!snd) snd = new Audio(AUDIO); try { snd.currentTime = 0; var p = snd.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
    root.addEventListener('click', function () {
      sound = !sound; T0 = performance.now();
      if (sound) { play(); hint.textContent = 'звук включён · нажми, чтобы выключить'; } else { if (snd) snd.pause(); hint.textContent = 'нажми, чтобы включить звук'; }
    });
    var wasLoop = 0;
    function tick(now) {
      var el = (now - T0) / 1000, cyc = DUR + .5, t = el % cyc, n = Math.floor(el / cyc);
      if (n !== wasLoop) { wasLoop = n; if (sound) play(); }
      render(root, Math.min(t, DUR));
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  window.ApBoot.live = live;
})();
Array.prototype.forEach.call(document.querySelectorAll("[data-t]"),function(r){ApBoot.render(r,parseFloat(r.getAttribute("data-t")));});</script>
