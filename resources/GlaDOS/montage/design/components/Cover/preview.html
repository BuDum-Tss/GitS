<!-- @dsCard height=288 -->
<div class="cover">
  <style>
    .cover { position: relative; width: 960px; height: 288px; background: var(--sign-paper, #f7f7f5); overflow: hidden; }
    .cover svg { position: absolute; left: 0; top: 0; }
    .cover .bp { fill: var(--bp-mid, #2b6fba); }
    .cover .dark { fill: var(--chamberDark, #15181c); }
    .cover .paper { fill: var(--sign-paper, #f7f7f5); }
    .cover .orange { fill: var(--portalOrange, #ff8b1f); }
    .cover .blue { fill: var(--portalBlue, #2aa7ff); }
    .cover .plus { stroke: var(--bp-line, #eaf4ff); stroke-width: 2; opacity: .55; }
    .cover .name { position: absolute; left: 40px; bottom: 66px; margin: 0; width: 420px;
      font-family: "Aperture Cond", var(--font-plex, sans-serif); font-weight: 700; font-stretch: 75%;
      font-variation-settings: "wdth" 75; font-size: 64px; line-height: .95; color: var(--sign-ink, #111317); }
    .cover .tag { position: absolute; left: 40px; bottom: 36px; width: 420px; margin: 0;
      font-family: "Aperture Cond", var(--font-plex, sans-serif); font-weight: 500; font-size: 14px; color: var(--sign-muted, #5a6068); }
  </style>
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!-- blocks: bp-mid slab 288×288 (bleeds top/bottom), chamberDark 96×192, sign-paper card 120×144 on the slab, portalOrange 48×48, portalBlue 48×96 -->
    <!-- arrangement: one big blueprint slab with satellites right of x=480; the paper card sits on the slab like a chamber sign on a wall -->
    <!-- pattern: plus grid at 48px (grid-cell) in bp-line over the slab — the blueprint sheet is the most specific thing in this system -->
    <!-- steps: plus pitch 48 (2 × bp-cell), radius-plate 4 -->
    <rect class="bp" x="528" y="0" width="288" height="288"/>
    <g>
      <path class="plus" d="M552 48h16M560 40v16M600 48h16M608 40v16M648 48h16M656 40v16M696 48h16M704 40v16M744 48h16M752 40v16M552 240h16M560 232v16M600 240h16M608 232v16M648 240h16M656 232v16M696 240h16M704 232v16M744 240h16M752 232v16M792 144h16M800 136v16"/>
    </g>
    <rect class="paper" x="600" y="72" width="120" height="144" rx="4"/>
    <rect class="dark" x="612" y="88" width="56" height="10"/>
    <rect class="dark" x="612" y="176" width="96" height="6"/>
    <rect class="dark" x="816" y="48" width="96" height="192"/>
    <rect class="orange" x="864" y="240" width="48" height="48" rx="4"/>
    <rect class="blue" x="768" y="96" width="48" height="96" rx="4"/>
  </svg>
  <p class="name">Лаборатория<br>Aperture</p>
  <p class="tag">Интро, чертежи, комната ГЛаДОС, отбивки-таблички камер.</p>
</div>
