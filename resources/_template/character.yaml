# ШАБЛОН персонажа (ТЗ 05, CHR-8). Скопируйте папку в resources/<Имя>/ (id: строчные латинские буквы, цифры, _)
# и заполните. Папки с подчёркиванием не показываются в списке персонажей.

id: TODO_id                 # id персонажа (имя папки может быть любым)
name: TODO_имя              # как персонаж называет себя и как его видит пользователь (дашборд, трей, питомец)
aliases: [TODO_имя]         # как к нему обращаются: по этим словам модули узнают обращение
gender: neutral             # female / male / neutral: для грамматики промптов
language: ru
world: ""                   # мир для промптов и стиля монтажа

# Якорь (CHR-14): 3-5 опорных черт и манера речи, до 600 символов. Биография и мнения идут в memories.yaml.
anchor: ""

voice:                      # референс клонирования (Fish Speech) и запасной голос edge-tts; можно не задавать
  reference: voice/reference.wav
  edge_voice: ""
  pitch: ""
  rate: ""

emotions: {}                # набор эмоций задаёт fast_brain (общий для всех персонажей)
defaults: {}                # значения настроек по умолчанию для персонажа (пока пусто)
