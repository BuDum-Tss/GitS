<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Сцена: AFK, чертёж</title>
<link rel="stylesheet" href="common.css">
<style>
/* чертёж-blueprint по дизайн-системе: лист в клетку (24 и 120 px) со светом из центра, белые линии рисуются, рамка с отступом 28 */
body{background:
  linear-gradient(var(--bp-grid) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--bp-grid) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(var(--bp-grid-major) 1.5px,transparent 1.5px) 0 0/120px 120px,linear-gradient(90deg,var(--bp-grid-major) 1.5px,transparent 1.5px) 0 0/120px 120px,
  radial-gradient(ellipse at 50% 45%,var(--bp-center) 0%,var(--bp-mid) 48%,var(--bp-edge) 100%)}
#frame{position:absolute;inset:28px;border:2px solid rgba(234,244,255,.55)}
svg{position:absolute;inset:0;width:1920px;height:1080px}
.ln{fill:none;stroke:var(--bp-line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 18s linear infinite}
.wall{stroke-width:10}
.thin{stroke-width:1.6;opacity:.75}
@keyframes draw{0%{stroke-dashoffset:1}22%{stroke-dashoffset:0}80%{stroke-dashoffset:0}92%{stroke-dashoffset:-1}100%{stroke-dashoffset:-1}}
.t{font:24px PlexMono,Consolas,monospace;fill:var(--bp-line);opacity:0;animation:blink 18s linear infinite}
@keyframes blink{0%,18%{opacity:0}26%,80%{opacity:1}90%,100%{opacity:0}}
.dot{fill:var(--bp-line);opacity:0;animation:blink 18s linear infinite}
#gear{transform-origin:1480px 330px;animation:spin 30s linear infinite}
#scan{animation:scan 7s ease-in-out infinite;fill:var(--bp-line);opacity:.12}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{0%,100%{transform:translateX(120px)}50%{transform:translateX(1700px)}}
.dots{position:absolute;right:300px;bottom:270px}
.dots span{display:inline-block;width:14px;height:14px;margin:0 6px;border-radius:50%;background:var(--bp-line);animation:dot 1.4s infinite}
.dots span:nth-child(2){animation-delay:.25s}.dots span:nth-child(3){animation-delay:.5s}
@keyframes dot{0%,80%,100%{opacity:.2;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
#st{right:90px;bottom:70px;width:200px;height:auto}
</style></head><body>
<div id="frame"></div>
<svg viewBox="0 0 1920 1080" aria-hidden="true">
  <rect id="scan" x="0" y="110" width="4" height="860"/>
  <g id="plan">
    <path class="ln wall" pathLength="1" style="animation-delay:0s" d="M180 240H900V520H620V820H180Z"/>
    <path class="ln wall" pathLength="1" style="animation-delay:.6s" d="M900 380H1180V820H620"/>
    <path class="ln thin" pathLength="1" style="animation-delay:1.2s" d="M180 380H620M400 240V520M900 520V680H1180"/>
    <path class="ln" pathLength="1" style="animation-delay:1.8s" d="M300 820V700H420V820"/>
    <circle class="ln" pathLength="1" style="animation-delay:2.4s" cx="760" cy="650" r="70"/>
    <circle class="ln thin" pathLength="1" style="animation-delay:2.8s" cx="760" cy="650" r="40"/>
    <path class="ln thin" pathLength="1" style="animation-delay:3.2s" d="M180 190V215M900 190V215M180 202H900M1230 380V820M1218 380H1242M1218 820H1242"/>
    <circle class="dot" cx="760" cy="650" r="5" style="animation-delay:.3s"/>
    <path class="ln thin" pathLength="1" style="animation-delay:3.6s" d="M760 650L860 760H980"/>
    <text class="t" x="470" y="186" style="animation-delay:.3s" id="d1">720</text>
    <text class="t" x="1250" y="610" style="animation-delay:.3s" id="d2">440</text>
    <text class="t" x="990" y="768" style="animation-delay:.3s" id="d3">R 70</text>
  </g>
  <g id="gear"><path class="ln" pathLength="1" style="animation-delay:1s" id="gp" d=""/>
    <circle class="ln thin" pathLength="1" style="animation-delay:1.4s" cx="1480" cy="330" r="46"/></g>
  <g>
    <path class="ln thin" pathLength="1" style="animation-delay:2s" d="M1280 600H1700V800H1280Z"/>
    <path class="ln" pathLength="1" style="animation-delay:2.6s" d="M1300 770L1380 700L1440 740L1520 650L1600 690L1680 620"/>
    <text class="t" x="1290" y="586" style="animation-delay:.3s" id="d4">0.00</text>
  </g>
</svg>
<div class="dots"><span></span><span></span><span></span></div>
<img id="st" class="sticker" src="stickers/thinking.png" alt="">
<script src="common.js"></script>
<script>
// зубчатое колесо
(function(){const cx=1480,cy=330,n=14,r1=120,r2=146;let d='';
  for(let i=0;i<n*2;i++){const a=Math.PI*i/n,r=i%2?r1:r2,a2=a+Math.PI/(n*2)*0.5;
    d+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1)+' L'+(cx+r*Math.cos(a2)).toFixed(1)+' '+(cy+r*Math.sin(a2)).toFixed(1)}
  document.getElementById('gp').setAttribute('d',d+'Z')})();
// цифры на чертеже пересчитываются раз в цикл
const rnd=(a,b)=>Math.round(a+Math.random()*(b-a));
setInterval(()=>{d1.textContent=rnd(600,900);d2.textContent=rnd(300,520);d3.textContent='R '+rnd(40,90);d4.textContent=(Math.random()*9).toFixed(2)},18000);
StreamScene.bind({sticker: document.getElementById('st')});
</script>
</body></html>
