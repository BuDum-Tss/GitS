<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Сцена: AFK, чертежи</title>
<link rel="stylesheet" href="common.css">
<style>
body{background:#0e2233}
#bg{position:absolute;inset:0;background:
  linear-gradient(#2d5a7d44 1px,transparent 1px) 0 0/96px 96px,linear-gradient(90deg,#2d5a7d44 1px,transparent 1px) 0 0/96px 96px,
  linear-gradient(#2d5a7d22 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,#2d5a7d22 1px,transparent 1px) 0 0/24px 24px,
  radial-gradient(ellipse at 50% 45%,#16344d 0%,#0a1a28 75%)}
svg{position:absolute;inset:0;width:1920px;height:1080px}
.ln{fill:none;stroke:#cfe9ff;stroke-width:3;stroke-linecap:square;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 18s linear infinite}
.thin{stroke-width:1.5;stroke:#7fb4de}
.dim{stroke:#ffb43c;stroke-width:2}
@keyframes draw{0%{stroke-dashoffset:1}22%{stroke-dashoffset:0}80%{stroke-dashoffset:0}92%{stroke-dashoffset:-1}100%{stroke-dashoffset:-1}}
.t{font:22px "IBM Plex Mono",Consolas,monospace;fill:#ffb43c;opacity:0;animation:blink 18s linear infinite}
@keyframes blink{0%,18%{opacity:0}26%,80%{opacity:1}90%,100%{opacity:0}}
#gear{transform-origin:1480px 330px;animation:spin 24s linear infinite}
#scan{animation:scan 6s ease-in-out infinite;fill:#7fd0ff;opacity:.18}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{0%,100%{transform:translateX(120px)}50%{transform:translateX(1700px)}}
.dots span{display:inline-block;width:14px;height:14px;margin:0 6px;border-radius:50%;background:#ffb43c;animation:dot 1.4s infinite}
.dots span:nth-child(2){animation-delay:.25s}.dots span:nth-child(3){animation-delay:.5s}
@keyframes dot{0%,80%,100%{opacity:.2;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
#st{right:90px;bottom:70px;width:260px;height:auto}
.dots{position:absolute;right:150px;bottom:360px}
#gear path{fill:none;stroke:#cfe9ff;stroke-width:3}
</style></head><body>
<div id="bg"></div>
<svg viewBox="0 0 1920 1080" aria-hidden="true">
  <rect id="scan" x="0" y="110" width="6" height="860"/>
  <g id="plan">
    <path class="ln" pathLength="1" style="animation-delay:0s" d="M180 240H900V520H620V820H180Z"/>
    <path class="ln" pathLength="1" style="animation-delay:.6s" d="M900 380H1180V820H620"/>
    <path class="ln thin" pathLength="1" style="animation-delay:1.2s" d="M180 380H620M400 240V520M900 520V680H1180"/>
    <path class="ln" pathLength="1" style="animation-delay:1.8s" d="M300 820V700H420V820"/>
    <circle class="ln" pathLength="1" style="animation-delay:2.4s" cx="760" cy="650" r="70"/>
    <circle class="ln thin" pathLength="1" style="animation-delay:2.8s" cx="760" cy="650" r="40"/>
    <path class="ln dim" pathLength="1" style="animation-delay:3.2s" d="M180 190V215M900 190V215M180 202H900M1230 380V820M1218 380H1242M1218 820H1242"/>
    <text class="t" x="470" y="186" style="animation-delay:.3s" id="d1">720</text>
    <text class="t" x="1250" y="610" style="animation-delay:.3s" id="d2">440</text>
    <text class="t" x="700" y="740" style="animation-delay:.3s" id="d3">R 70</text>
  </g>
  <g id="gear"><path class="ln" pathLength="1" style="animation-delay:1s" id="gp" d=""/>
    <circle class="ln thin" pathLength="1" style="animation-delay:1.4s" cx="1480" cy="330" r="46"/></g>
  <g>
    <path class="ln thin" pathLength="1" style="animation-delay:2s" d="M1280 600H1700V800H1280Z"/>
    <path class="ln" pathLength="1" style="animation-delay:2.6s" d="M1300 770L1380 700L1440 740L1520 650L1600 690L1680 620"/>
    <text class="t" x="1290" y="590" style="animation-delay:.3s" id="d4">0.00</text>
  </g>
</svg>
<div class="dots"><span></span><span></span><span></span></div>
<img id="st" class="sticker" src="stickers/thinking.png" alt="">
<script src="common.js"></script>
<script>
// зубчатое колесо
(function(){const cx=1480,cy=330,n=14,r1=120,r2=146;let d='';
  for(let i=0;i<n*2;i++){const a=Math.PI*i/n,r=i%2?r1:r2,a2=a+Math.PI/(n*2)*0.5;
    d+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1)+' L'+(cx+r*Math.cos(a2)).toFixed(1)+' '+(cy+r*Math.sin(a2)).toFixed(1)}
  document.getElementById('gp').setAttribute('d',d+'Z')})();
// цифры на чертеже меняются раз в цикл: будто пересчитывает
const rnd=(a,b)=>Math.round(a+Math.random()*(b-a));
setInterval(()=>{d1.textContent=rnd(600,900);d2.textContent=rnd(300,520);d3.textContent='R '+rnd(40,90);d4.textContent=(Math.random()*9).toFixed(2)},18000);
StreamScene.bind({sticker: document.getElementById('st')});
</script>
</body></html>
