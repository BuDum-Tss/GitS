<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Сцена: кабинет</title>
<link rel="stylesheet" href="common.css">
<style>
body{background:#10151b url(glados-room.webp) center/1920px 1080px no-repeat}
.cable{position:absolute;left:1043px;top:-20px;width:12px;height:340px;z-index:0;background:linear-gradient(90deg,#14181d,#3a424b 50%,#14181d);border-radius:7px;transform-origin:50% 0;animation:sway 7s ease-in-out infinite}
.cable.b{left:1022px;width:7px;animation-delay:-.3s}
#st{left:880px;top:290px;width:340px;height:auto;z-index:1;animation:sway 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
.sub{left:50%;transform:translate(-50%,8px);bottom:70px;text-align:center}
.sub.on{transform:translate(-50%,0)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 40%,rgba(8,10,12,.55) 100%);pointer-events:none}
</style></head><body>
<div id="vig"></div>
<div class="cable"></div><div class="cable b"></div>
<img id="st" class="sticker" src="stickers/idle.png" alt="">
<div id="sub" class="sub"></div>
<script src="common.js"></script>
<script>StreamScene.bind({sticker: document.getElementById('st'), sub: document.getElementById('sub')});</script>
</body></html>
