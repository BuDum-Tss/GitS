# Участники шины, которые ядро запускает само (ТЗ 02, раздел 7). Пути: абсолютные или относительно папки agent/.
# {GITS} (корень репозитория GitS), {PYTHON} (интерпретатор ядра), {PYTHONW} (pythonw.exe рядом с ним) и любые переменные окружения ядра в фигурных
# скобках (после загрузки .env) подставляются. Нет переменной: запись помечается «не настроен» и не запускается.
# Разделы: workspaces (окружения: инструменты, события, рабочее место; поле ownership: shared - общее, берётся в аренду, или
# owned - живёт внутри ядра персонажа), services (сервисы: голос, питомец, а также внешние процессы без WebSocket: `kind: service`
# с `health_url`) и planned (запланированные, серые карточки). Если манифест подключившегося участника содержит `role` или
# `ownership`, они главнее записи здесь. Пути cwd: `{GITS}/workspaces/<id>` и `{GITS}/services/<id>`.
# Поля записи: id; cwd; command; args; autostart (запускать вместе с ядром, если участник включён); restart (always | on-failure |
# never); enabled (включён ли, пока пользователь не выбрал сам: настройка peers.<id>.enabled в дашборде); title и description
# (как запись называется и описывается во вкладках «Окружения» и «Сервисы»; перекрывают манифест); dev: true (запись видна во вкладках
# только при настройке dev_mode); health_url и skip_when_env (у внешних сервисов).
# Реальные записи: telegram - ТЗ 10, rimworld - ТЗ 11, voice - ТЗ 12, desktop - ТЗ 14, montage - ТЗ 20 (ниже).
# Общее пространство в контейнере (аренда): `external: true` (процесс запускает не супервизор, `command` не нужен), `control_url`
# (адрес интерфейса управления, например http://montage:8780) и `control_token_env` (переменная с токеном, по умолчанию
# GITS_CONTROL_TOKEN). Пример см. в peers.container.yaml. Адрес шины для сервиса: GITS_CORE_PUBLIC_URL (по умолчанию
# ws://127.0.0.1:<порт>/ws). Записи без control_url (rimworld, desktop, montage на хосте) работают без аренды, как раньше.
# Участникам передаются GITS_TOKEN, GITS_CORE_URL, GITS_ID и MEMORY_DIR (абсолютный путь к папке памяти ядра); на время перехода
# ещё и прежние GITS_MODULE_TOKEN и GITS_MODULE_ID.
workspaces:
  - id: telegram
    ownership: owned
    title: Telegram
    cwd: "{GITS}/workspaces/telegram"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure       # секреты (TELEGRAM_*) модуль читает сам из .env; без них он работает и пишет «не настроен»

  # Стример (фаза 3b): Twitch и OBS одним окружением и одним процессом. Twitch: чат и события канала, ответы, модерация, название
  # трансляции; секреты TWITCH_* читает сам из .env, токены входа создаёт workspaces/streamer/twitch/tw_login.py. OBS: сцены,
  # трансляция, запись, субтитры в поток через obs-websocket; пароль OBS_WEBSOCKET_PASSWORD (и адрес OBS_WEBSOCKET_URL) тоже из
  # .env. Без настроек Twitch пишет «не настроен», без OBS «не на связи».
  - id: streamer
    ownership: owned
    title: Стример
    cwd: "{GITS}/workspaces/streamer"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure

  # Компьютер (ТЗ 14): экран, приложения, мышь и клавиатура, Claude-помощник для задач на ПК. Зависимости модуля:
  # workspaces/desktop/requirements.txt (в окружение ядра). Экран и ввод работают только в Windows.
  - id: desktop
    ownership: shared
    title: Компьютер
    cwd: "{GITS}/workspaces/desktop"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure

  # RimWorld (ТЗ 11): модуль лежит в этом репозитории (workspaces/rimworld). Интерпретатор общий ({PYTHON}): зависимости игрового
  # агента и пакет gits-sdk стоят в нём же, отдельного .venv у модуля нет. Данные модуля лежат в его папке agent/memory
  # (RIMWORLD_MEMORY_DIR), а не в MEMORY_DIR ядра, который супервизор передаёт всем модулям.
  - id: rimworld
    ownership: shared
    title: RimWorld
    cwd: "{GITS}/workspaces/rimworld/agent"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure

  # Монтаж видео (ТЗ 20-22): модуль лежит в этом репозитории (workspaces/montage). Окружение у модуля своё: workspaces/montage/.venv
  # (Python 3.12, claude-agent-sdk, gits-sdk), поэтому интерпретатор не {PYTHON}. Нужны Node.js и ffmpeg.
  - id: montage
    ownership: shared
    title: Монтаж видео
    cwd: "{GITS}/workspaces/montage/agent"
    command: "{GITS}/workspaces/montage/.venv/Scripts/python.exe"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure

  - id: echo
    ownership: owned
    title: Пример модуля (для разработчиков)
    description: повторяет текст; проверка протокола модулей
    dev: true            # во вкладке «Модули» виден только при настройке dev_mode
    cwd: "{GITS}/sdk/examples"
    command: "{PYTHON}"
    args: ["-u", "echo_module.py"]
    autostart: true
    restart: on-failure
    enabled: false       # тестовый модуль: выключен по умолчанию, включается в дашборде (вкладка «Окружения»)

services:
  # Голос (ТЗ 12): весь звук - микрофон, распознавание, узнавание голосов, синтез, воспроизведение, слух системного звука.
  # Зависимости модуля: services/voice/requirements.txt (в окружение ядра); Fish Speech и WhisperX в docker необязательны.
  - id: voice
    title: Голос
    cwd: "{GITS}/services/voice"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure

  # Питомец (ТЗ 13): окно на рабочем столе, запускается ядром (трей его больше не запускает). {PYTHONW} это pythonw.exe из
  # окружения ядра (без консоли). Показать/скрыть: настройка pet_visible (пункт трея «Показывать питомца»), модуль при этом
  # остаётся подключённым.
  - id: pet
    title: Питомец
    cwd: "{GITS}/services/pet"
    command: "{PYTHONW}"
    args: ["main.py"]
    autostart: true
    restart: on-failure

  # Внешние сервисы (kind: service, ТЗ 03, ATT-2): процесс без связи по WebSocket; супервизор считает его работающим, пока health_url
  # отвечает 200 (опрос раз в 10 с), и перезапускает по restart. Если порт занят уже работающим сервисом (запущен не
  # супервизором), второй экземпляр не запускается, идёт только слежение за здоровьем.
  - id: decider
    title: Классификатор внимания
    description: "часть ядра: быстрая оценка событий; работает отдельным процессом (Python 3.12 + torch)"
    kind: service
    cwd: "{GITS}/services/decider"
    command: "{GITS}/services/decider/.venv/Scripts/python.exe"      # Python 3.12 с torch CPU, см. services/decider/README.md
    args: ["decider_server.py"]
    health_url: "http://127.0.0.1:8768/health"
    autostart: true
    restart: on-failure

  # Синтез речи ESpeech-TTS-1 (F5-TTS, русский): сервис для модуля голоса, окружение Python 3.12 + CUDA torch в
  # services/f5-tts/.venv (установка и веса: services/f5-tts/README.md). Пока модель грузится, /health отвечает 503.
  # Нет сервиса: модуль голоса пользуется Fish Speech, потом edge-tts (`TTS_ENGINE`, services/voice/tts_engine.py).
  - id: espeech
    title: Синтез речи ESpeech
    description: "русский голос персонажа по референсу (F5-TTS); работает отдельным процессом на видеокарте"
    kind: service
    cwd: "{GITS}/services/f5-tts"
    command: "{GITS}/services/f5-tts/.venv/Scripts/python.exe"
    args: ["f5_server.py"]
    health_url: "http://127.0.0.1:8771/health"
    skip_when_env: {TTS_ENGINE: [fish, edge], ESPEECH_EXTERNAL: ["1"]}     # TTS_ENGINE=fish|edge в .env: этот голос не запускается; ESPEECH_EXTERNAL=1: сервис уже в контейнере (docker compose up -d espeech)
    autostart: true
    restart: on-failure

# Запланированные окружения: ядро их не запускает, вкладка «Окружения» показывает серые карточки «ещё не установлен - запланирован».
# Поля: id, title, tz (номер ТЗ, если оно есть). Когда окружение появится, запись переезжает в workspaces выше.
planned:
  - id: minecraft
    title: Minecraft
