# Участники ядра в контейнере (GITS_CONTAINER=1, GITS_PEERS_FILE=agent/peers.container.yaml): только то, что не требует железа
# ПК. Голос, питомец и «Компьютер» запускаются на хосте и подключаются к ядру по WebSocket (/ws) на опубликованный
# порт (GITS_CORE_URL, GITS_TOKEN). Монтаж и RimWorld это отдельные контейнеры-пространства (compose, сервисы montage и rimworld): ядро его не запускает,
# а берёт в аренду (поля `external: true`, `control_url`, `control_token_env`; адрес шины для сервиса: GITS_CORE_PUBLIC_URL). Сервисов decider и espeech здесь нет: они внешние (decider это общий контейнер `decider`, http://decider:8768), ядро ходит к ним по адресам из
# переменных окружения (GITS_DECIDER_URL и др.). {GITS} в контейнере это /app, {PYTHON} интерпретатор образа.
# Формат записей тот же, что у agent/peers.yaml (разделы workspaces и services); здесь только окружения со своим владением (owned). Секреты модули читают из окружения контейнера (env_file compose).
workspaces:
  - id: telegram
    ownership: owned
    title: Telegram
    cwd: "{GITS}/workspaces/telegram"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure

  - id: telemost
    ownership: owned
    title: Яндекс Телемост
    cwd: "{GITS}/workspaces/telemost"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure

  # Discord (бот, текст: каналы, ветки, личка). Токен DISCORD_BOT_TOKEN из окружения контейнера (env_file compose); без него «не настроен»
  - id: discord
    ownership: owned
    title: Discord
    cwd: "{GITS}/workspaces/discord"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure

  # Стример (Twitch и OBS одним окружением). OBS на хосте: адрес OBS_WEBSOCKET_URL в окружении контейнера (compose: ws://host.docker.internal:4455)
  - id: streamer
    ownership: owned
    title: Стример
    cwd: "{GITS}/workspaces/streamer"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure

  # Монтаж: общее пространство в своём контейнере (compose запускает его, супервизор нет: `external: true`). Агент берёт его в аренду
  # по control_url (токен управления из GITS_CONTROL_TOKEN в .env хоста; без него аренда отключена), сервис подключается к ядру
  # по GITS_CORE_PUBLIC_URL. Описание (для чего и когда переходить) ядро читает у самого сервиса: GET /info.
  - id: montage
    ownership: shared
    external: true
    title: Монтаж видео
    control_url: http://montage:8780
    control_token_env: GITS_CONTROL_TOKEN

  # RimWorld: общее пространство в своём контейнере (как монтаж: compose запускает его, супервизор нет, `external: true`). Игра, окно и
  # ввод остаются на хосте за хостовым помощником (docs/RIMWORLD_CONTAINER.md). В режиме «ядро на хосте» (agent/peers.yaml) та же
  # запись rimworld с autostart запускает модуль локально: два режима не смешиваются, потому что файл выбирается GITS_PEERS_FILE.
  # Контейнер недоступен: окружение показывается как не подключённое, ядро работает.
  - id: rimworld
    ownership: shared
    external: true
    title: RimWorld
    control_url: http://rimworld:8782
    control_token_env: GITS_CONTROL_TOKEN
