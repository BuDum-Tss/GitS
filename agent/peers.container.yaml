# Участники ядра в контейнере (GITS_CONTAINER=1, GITS_PEERS_FILE=agent/peers.container.yaml): только то, что не требует железа
# ПК. Голос, питомец, «Компьютер» и RimWorld запускаются на хосте и подключаются к ядру по WebSocket (/ws) на опубликованный
# порт (GITS_CORE_URL, GITS_TOKEN). Монтаж это отдельный контейнер-пространство (compose, профиль montage): ядро его не запускает,
# а берёт в аренду (поля `external: true`, `control_url`, `control_token_env`; адрес шины для сервиса: GITS_CORE_PUBLIC_URL). Сервисов decider и espeech здесь нет: они внешние, ядро ходит к ним по адресам из
# переменных окружения (GITS_DECIDER_URL и др.). {GITS} в контейнере это /app, {PYTHON} интерпретатор образа.
# Формат записей тот же, что у agent/peers.yaml (разделы workspaces и services); здесь только окружения со своим владением (owned). Секреты модули читают из окружения контейнера (env_file compose).
workspaces:
  - id: telegram
    ownership: owned
    title: Telegram
    cwd: "{GITS}/modules/telegram"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure

  - id: twitch
    ownership: owned
    title: Twitch
    cwd: "{GITS}/modules/twitch"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure

  # OBS на хосте: адрес OBS_WEBSOCKET_URL в окружении контейнера (compose: ws://host.docker.internal:4455)
  - id: obs
    ownership: owned
    title: OBS
    cwd: "{GITS}/modules/obs"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure

  # Монтаж: общее пространство в своём контейнере (compose запускает его, супервизор нет: `external: true`). Агент берёт его в аренду
  # по control_url (токен управления из GITS_CONTROL_TOKEN в .env хоста; без него аренда отключена), сервис подключается к ядру
  # по GITS_CORE_PUBLIC_URL. Описание (для чего и когда переходить) ядро читает у самого сервиса: GET /info.
  - id: montage
    ownership: shared
    external: true
    title: Монтаж видео
    control_url: http://montage:8780
    control_token_env: GITS_CONTROL_TOKEN
