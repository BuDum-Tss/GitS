# Жёсткие правила до модели (ТЗ 25, FAST-2). Никакого ML: срабатывают по тексту, в том числе по обрывку распознавания
# («замол», «стоп»). Меняются без правки кода. Версия идёт в журнал решений.
version: 1

# «Замолчи»: оборвать речь и генерацию ответа сразу, до любых вызовов модели.
stop:
  # короткая фраза целиком (регулярные выражения по нормализованному тексту: нижний регистр, «ё» как «е», без знаков)
  patterns:
    - '^(пожалуйста )?(замолчи|замолчите|помолчи|помолчите|молчи|заткнись|тихо|стоп|хватит|stop|shut up)( пожалуйста)?$'
    - '^(хватит|прекрати|перестань)( болтать| говорить| трепаться)?( пожалуйста)?$'
  # основы слов: достаточно начала слова из фразы не длиннее max_words слов (обрыв «замол» тоже подходит)
  stems: [замолч, помолч, заткн, умолкн, замолк]
  max_words: 5

# Ответ на открытый вопрос о разрешении: пока вопрос задан, короткое «да/нет» принадлежит ему.
approval:
  accept: [да, ага, угу, давай, ладно, хорошо, разрешаю, можно, конечно, подтверждаю, 'yes', 'ok', окей]
  decline: [нет, неа, не надо, не нужно, запрещаю, отмена, отмени, не разрешаю, 'no']
  max_words: 3

# Экстренные слова (целые слова, без обрывков: «помоги мне» - обычная просьба): речь и генерация обрываются сразу.
emergency:
  stems: [помогит, пожар, скорую, спасит, караул]
  max_words: 6
