# Модули ядра в контейнере (GITS_CONTAINER=1, GITS_MODULES_FILE=agent/modules.container.yaml): только то, что не требует железа
# ПК. Голос, питомец, «Компьютер», RimWorld и монтаж запускаются на хосте и подключаются к ядру по WebSocket на опубликованный
# порт (GITS_CORE_URL, GITS_MODULE_TOKEN). Сервисов decider и espeech здесь нет: они внешние, ядро ходит к ним по адресам из
# переменных окружения (GITS_DECIDER_URL и др.). {GITS} в контейнере это /app, {PYTHON} интерпретатор образа.
# Формат записей тот же, что у agent/modules.yaml. Секреты модули читают из окружения контейнера (env_file compose).
modules:
  - id: telegram
    title: Telegram
    cwd: "{GITS}/modules/telegram"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure

  - id: twitch
    title: Twitch
    cwd: "{GITS}/modules/twitch"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure

  # OBS на хосте: адрес OBS_WEBSOCKET_URL в окружении контейнера (compose: ws://host.docker.internal:4455)
  - id: obs
    title: OBS
    cwd: "{GITS}/modules/obs"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure
