# Модули, которые ядро запускает само (ТЗ 02, раздел 7). Пути: абсолютные или относительно папки agent/.
# {GITS} (корень репозитория GitS), {PYTHON} (интерпретатор ядра) и любые переменные окружения ядра в фигурных
# скобках (после загрузки secrets.env) подставляются. Нет переменной: модуль помечается «не настроен» и не запускается.
# Поля: id; cwd; command; args; autostart (запускать вместе с ядром, если модуль включён); restart (always | on-failure |
# never); enabled (включён ли, пока пользователь не выбрал сам: настройка modules.<id>.enabled в дашборде); title.
# Реальные модули добавляют ТЗ 11-14, 20: rimworld, voice, pet, desktop, montage (telegram - ТЗ 10, ниже).
# Модулям передаются GLADOS_MODULE_TOKEN, GLADOS_CORE_URL, GLADOS_MODULE_ID и MEMORY_DIR (абсолютный путь к папке памяти ядра).
modules:
  - id: telegram
    title: Telegram
    cwd: "{GITS}/modules/telegram"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure       # секреты (TELEGRAM_*) модуль читает сам из agent/secrets.env; без них он работает и пишет «не настроен»

  - id: echo
    title: Эхо
    cwd: "{GITS}/sdk/examples"
    command: "{PYTHON}"
    args: ["-u", "echo_module.py"]
    autostart: true
    restart: on-failure
    enabled: false       # тестовый модуль: выключен по умолчанию, включается в дашборде (вкладка «Модули»)

  # Сервисы (kind: service, ТЗ 03, ATT-2): процесс без связи по WebSocket; супервизор считает его работающим, пока health_url
  # отвечает 200 (опрос раз в 10 с), и перезапускает по restart. Если порт занят уже работающим сервисом (запущен не
  # супервизором), второй экземпляр не запускается, идёт только слежение за здоровьем.
  - id: decider
    title: Классификатор (decider)
    kind: service
    cwd: "{GITS}/services/decider"
    command: "{GITS}/services/decider/.venv/Scripts/python.exe"      # Python 3.12 с torch CPU, см. services/decider/README.md
    args: ["decider_server.py"]
    health_url: "http://127.0.0.1:8768/health"
    autostart: true
    restart: on-failure
