# Модули, которые ядро запускает само (ТЗ 02, раздел 7). Пути: абсолютные или относительно папки agent/.
# {GITS} (корень репозитория GitS), {PYTHON} (интерпретатор ядра), {PYTHONW} (pythonw.exe рядом с ним) и любые переменные окружения ядра в фигурных
# скобках (после загрузки secrets.env) подставляются. Нет переменной: модуль помечается «не настроен» и не запускается.
# Поля: id; cwd; command; args; autostart (запускать вместе с ядром, если модуль включён); restart (always | on-failure |
# never); enabled (включён ли, пока пользователь не выбрал сам: настройка modules.<id>.enabled в дашборде); title и description
# (как запись называется и описывается во вкладке «Модули»; перекрывают манифест); dev: true (запись видна во вкладке только при настройке dev_mode).
# Реальные модули добавляют ТЗ 20: montage (telegram - ТЗ 10, rimworld - ТЗ 11, voice - ТЗ 12, desktop - ТЗ 14, ниже).
# Модулям передаются GLADOS_MODULE_TOKEN, GLADOS_CORE_URL, GLADOS_MODULE_ID и MEMORY_DIR (абсолютный путь к папке памяти ядра).
modules:
  - id: telegram
    title: Telegram
    cwd: "{GITS}/modules/telegram"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure       # секреты (TELEGRAM_*) модуль читает сам из agent/secrets.env; без них он работает и пишет «не настроен»

  # Голос (ТЗ 12): весь звук - микрофон, распознавание, узнавание голосов, синтез, воспроизведение, слух системного звука.
  # Зависимости модуля: modules/voice/requirements.txt (в окружение ядра); Fish Speech и WhisperX в docker необязательны.
  - id: voice
    title: Голос
    cwd: "{GITS}/modules/voice"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure

  # Компьютер (ТЗ 14): экран, приложения, мышь и клавиатура, Claude-помощник для задач на ПК. Зависимости модуля:
  # modules/desktop/requirements.txt (в окружение ядра). Экран и ввод работают только в Windows.
  - id: desktop
    title: Компьютер
    cwd: "{GITS}/modules/desktop"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure

  # Питомец (ТЗ 13): окно на рабочем столе, запускается ядром (трей его больше не запускает). {PYTHONW} это pythonw.exe из
  # окружения ядра (без консоли). Показать/скрыть: настройка pet_visible (пункт трея «Показывать питомца»), модуль при этом
  # остаётся подключённым.
  - id: pet
    title: Питомец
    cwd: "{GITS}/modules/pet"
    command: "{PYTHONW}"
    args: ["main.py"]
    autostart: true
    restart: on-failure

  # RimWorld (ТЗ 11): отдельный репозиторий rimworld-module. {RIMWORLD_MODULE_DIR} ядро находит само (module_dirs.py: переменная
  # RIMWORLD_MODULE_DIR, запасная RIMWORLD_AGENT_DIR, соседняя папка rimworld-module или rimworld-agent). Интерпретатор общий ({PYTHON}):
  # зависимости игрового агента и пакет glados-module стоят в нём же, отдельного .venv у модуля нет. Данные модуля лежат в его папке
  # agent/memory (RIMWORLD_MEMORY_DIR), а не в MEMORY_DIR ядра, который супервизор передаёт всем модулям.
  - id: rimworld
    title: RimWorld
    cwd: "{RIMWORLD_MODULE_DIR}/agent"
    command: "{PYTHON}"
    args: ["-u", "main.py"]
    autostart: true
    restart: on-failure

  - id: echo
    title: Пример модуля (для разработчиков)
    description: повторяет текст; проверка протокола модулей
    dev: true            # во вкладке «Модули» виден только при настройке dev_mode
    cwd: "{GITS}/sdk/examples"
    command: "{PYTHON}"
    args: ["-u", "echo_module.py"]
    autostart: true
    restart: on-failure
    enabled: false       # тестовый модуль: выключен по умолчанию, включается в дашборде (вкладка «Модули»)

  # Сервисы (kind: service, ТЗ 03, ATT-2): процесс без связи по WebSocket; супервизор считает его работающим, пока health_url
  # отвечает 200 (опрос раз в 10 с), и перезапускает по restart. Если порт занят уже работающим сервисом (запущен не
  # супервизором), второй экземпляр не запускается, идёт только слежение за здоровьем.
  - id: decider
    title: Классификатор внимания
    description: "часть ядра: быстрая оценка событий; работает отдельным процессом (Python 3.12 + torch)"
    kind: service
    cwd: "{GITS}/services/decider"
    command: "{GITS}/services/decider/.venv/Scripts/python.exe"      # Python 3.12 с torch CPU, см. services/decider/README.md
    args: ["decider_server.py"]
    health_url: "http://127.0.0.1:8768/health"
    autostart: true
    restart: on-failure

# Запланированные модули: ядро их не запускает, вкладка «Модули» показывает серые карточки «ещё не установлен - запланирован».
# Поля: id, title, tz (номер ТЗ, если оно есть). Когда модуль появится, запись переезжает в modules выше.
planned:
  - id: montage
    title: Монтаж видео
    tz: "ТЗ 20–22"
  - id: minecraft
    title: Minecraft
